[build]
builder = "NIXPACKS"

[deploy]
# --proxy-headers + --forwarded-allow-ips='*': trust X-Forwarded-For/Proto so request.client.host is the real client
# (per-IP rate limits) and the scheme is https (HSTS). Safe only because Railway's edge proxy is the sole ingress.
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
